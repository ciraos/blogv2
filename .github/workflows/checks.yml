name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      # 拦截已废弃的远端路径（/storage-policies、/albums、/files、/file/folder-*、
      # /thumbnail/sign/*、/public/search），避免照着过时的 swagger 改回去。
      # 维护说明见 docs/api-known-issues.md
      - name: API inventory check
        run: pnpm api:inventory:check
