# =============================================================================
# blog-app 前台单容器编排
#
# 只运行前端容器；内容/数据来自现有的线上 pro 后端（anheyu/pro）。
# NEXT_PUBLIC_SITE_URL / NEXT_PUBLIC_API_URL 由项目根目录 .env 插值提供
# （docker compose 会自动读取同目录 .env，对 ${VAR} 做插值），不在 yml 写死。
# 缺省值写在此处，.env 未提供时才回退到它们。
#
# 使用：
#   docker compose up -d --build
#
# 注意：
#   * 同一份 .env 同时服务 Next（dev server 读取）与 compose（${VAR} 插值）。
#   * NEXT_PUBLIC_* 是浏览器端内联变量，改动后需重新构建（--build）。
#   * rewrites() 的后端基址会回退到 NEXT_PUBLIC_SITE_URL（同源），无需另配后端地址。
#   * 运行端口 3126 可按需映射（如改成 3000:3126）。
# =============================================================================

name: blog-app-frontend

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建期内联的浏览器端变量；取自 .env，未读到才用缺省
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://blog.ciraos.top}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://blog.ciraos.top/api}
    image: blog-app:latest
    container_name: blog-app-frontend
    restart: unless-stopped
    ports:
      - "3126:3126"
    environment:
      # 运行时只需这些；NEXT_PUBLIC_* 已在构建期内联
      PORT: 3126
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
